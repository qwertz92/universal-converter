# CI — lint, type-check, test, build on every push and PR.
# Mirrors the four local gates (AGENTS.md): npm run lint / check / test / build.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + ESLint)
        run: npm run lint

      - name: Type check (wrangler types + svelte-check)
        run: npm run check

      - name: Test (Vitest)
        run: npm test

      - name: Build (Cloudflare adapter)
        run: npm run build
